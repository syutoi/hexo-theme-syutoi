# Hexo Configuration
## Docs: http://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Syutoi
subtitle: A place to write, read and think.
description: 一个安静、清晰的写作与阅读空间。
keywords: 关键词1,关键词2 # edit for Theme.syutoi
author: Syutoi
language: zh-CN # 这里只可以选 zh-CN、zh-HK、zh-TW、ja、en 这几个格式
timezone: 'Asia/Shanghai'

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://hexo.syutoi.com
root: /
permalink: :title/ # edit for Theme.syutoi
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# The local theme links back to this repository; do not traverse its example
# site recursively or scan installed dependencies as theme files.
ignore:
  - '**/node_modules/**'
  - '**/themes/syutoi/example/**'

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: ''
prismjs:
  enable: false # edit for Theme.syutoi

# Category & Tag
default_category: uncategorized
category_map: # edit for Theme.syutoi
  计算机科学: computer-science
  Java: java
  二进制杂谈: note
  零基础学Java语言-浙江大学-翁恺: course-1
  Theme Syutoi Documentation: theme-syutoi-doc
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: http://hexo.io/plugins/
## Themes: http://hexo.io/themes/
theme: syutoi # edit for Theme.syutoi

# Deployment
## Docs: http://hexo.io/docs/deployment.html
deploy:
  type:


# Standard renderer: Markdown + small, explicit extensions.
markdown:
  preset: default
  render:
    html: true # Authored HTML such as details, ruby and media is allowed.
    xhtmlOut: false
    breaks: false
    linkify: true
    typographer: false
  plugins:
    - markdown-it-footnote
    - name: markdown-it-task-lists
      options:
        enabled: false
  anchors:
    level: 1
    collisionSuffix: ''
    permalink: false
  images:
    lazyload: true
    prepend_root: true
    post_asset: false

# algolia:
#   appId:
#   apiKey:
#   adminApiKey:
#   chunkSize: 5000
#   indexName:
#   fields:
#     - title #必须配置
#     - path #必须配置
#     - categories #推荐配置
#     - content:strip:truncate,0,4000
#     - gallery
#     - photos
#     - tags

feed:
    limit: 20
    order_by: "-date"
    tag_dir: false
    category_dir: false
    rss:
        enable: true
        template: "themes/syutoi/layout/_alternate/rss.ejs"
        output: "rss.xml"
    atom:
        enable: true
        template: "themes/syutoi/layout/_alternate/atom.ejs"
        output: "atom.xml"
    jsonFeed:
        enable: true
        template: "themes/syutoi/layout/_alternate/json.ejs"
        output: "feed.json"
