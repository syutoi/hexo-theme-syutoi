# Syutoi theme configuration
# Put your overrides in the BLOG's _config.syutoi.yml.
# Keep this file as the theme's defaults to make upgrades easier.
# A list override replaces the entire list; [] means no entries.
# Site title, subtitle, author, description and language belong in
# the blog's _config.yml, along with theme: syutoi.
# Full reference: docs/configuration.md

# Identity
# Empty name uses the site's title; empty avatar uses its initial.
# logo is the small mark beside the site title in the header.
# Empty logo keeps the letter mark fallback.
# Image paths are relative to the blog's source directory / site root.
# An external https:// URL also works; no image service is required.
branding:
  name: ''
  avatar: ''
  logo: /images/logo.png
  favicon: /images/favicon.png

# Appearance
# auto follows the operating system until the reader makes a choice.
# Reader preferences take priority over this starting value.
# cover is one fixed banner image, not an API or a random image list.
# Empty cover uses the built-in gradient background.
# Article covers are configured in each post's front matter.
appearance:
  theme: auto # auto | light | dark
  cover: ''

# Cards on the homepage, category and tag lists.
# Per-post summary: false hides its summary; a string supplies custom text.
# summary_length counts Unicode code points (1–1000).
# cover only controls list images, not the article or page banner.
post_list:
  summary: true
  summary_length: 160
  cover: true

# Article metadata (build-time estimate; per-post reading_time: false hides it).
post:
  reading_time: true

# Optional body-image viewer. A post/page can opt out with lightbox: false.
lightbox:
  enable: false

# Local search (none | pagefind). Per-post/page search: false excludes content.
search:
  provider: none

# Optional comments. Requires your own Waline server; loaded on reader request.
# Per-post/page comments: false disables the slot.
comments:
  provider: none # none | waline
  server_url: '' # Absolute http(s) Waline server URL

# Navigation
# Every item has a visible name and a destination URL.
# menu.* names use the corresponding entry in languages/*.yml.
# Any other name is displayed literally, including non-English text.
# Local paths automatically include the blog's root prefix.
# Change paths here if your archive/category/tag directories differ.
# Set menu: [] to hide navigation links (the site title remains a link).
navigation:
  menu:
    - name: menu.home
      url: /
    - name: menu.archives
      url: /archives/
    - name: menu.categories
      url: /categories/
    - name: menu.tags
      url: /tags/

# Add custom pages to your site before linking to them. For example:
# navigation:
#   menu:
#     - name: menu.home
#       url: /
#     - name: About
#       url: /about/
#     - name: Friends
#       url: /friends/
# Copy the whole menu when overriding it; lists are not appended.

# Social links
# Displayed as labelled links in the author sidebar.
# Names are plain text, URLs support https:// and mailto:.
# No remote icon font, SDK, tracking widget or automatic embed is loaded.
# Empty by default: replace examples with your own accounts.
social: []
# social:
#   - name: GitHub
#     url: https://github.com/yourname
#   - name: Email
#     url: mailto:hello@example.com

# Sidebar
# Disabling it uses a centred, single-column content area.
# statistics displays counts and links for posts/categories/tags.
# categories displays the top-level category list on non-post pages.
# toc displays sticky desktop / collapsible mobile heading links.
# Native links and the mobile disclosure work without JavaScript.
# Avatar, display name and description are configured above / in Hexo.
sidebar:
  enable: true
  statistics: true
  categories: true
  toc: true

# Footer
# since is an optional first publication year (an integer).
# Blank uses the current year only; future years are ignored.
# powered controls the visible Hexo / Syutoi attribution.
# rss shows a link only when the site's RSS feed is enabled.
# This theme does not configure or install a feed plugin for you.
footer:
  since:
  powered: true
  rss: true

# Keep rendering settings in the blog's _config.yml:
# - per_page / index_generator: pagination
# - markdown / highlight: renderer and syntax highlighting
# - feed: RSS, Atom and JSON feeds
# - url / root: site address and subdirectory deployment
# - date_format / timezone: dates
# Use real YAML booleans: false, not the string "false".
# Blank image values disable the image; unsafe URL schemes are omitted.
# Content remains readable with optional images and JS disabled.

# Legacy configuration migration:
# alternate -> branding.name
# sidebar.avatar + images -> branding.avatar (full path)
# darkmode -> appearance.theme
# menu -> navigation.menu ({name, url} list)
# social mapping -> social ({name, url} list)
# Old aliases are accepted during migration; new explicit values win.
# Retired CDN/player/comment/animation settings have no effect.
# See docs/migration-from-shoka.md for the detailed compatibility list.
